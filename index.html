<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>目標達成ダッシュボード</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .fade-in { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

// ─── Constants ────────────────────────────────────────────────────────────────

const CATEGORIES = {
  health:   { label: '健康・フィットネス', icon: '💪', text: 'text-emerald-700', light: 'bg-emerald-50 border-emerald-200', bar: 'bg-emerald-500', badge: 'bg-emerald-100 text-emerald-800' },
  career:   { label: '仕事・キャリア',     icon: '💼', text: 'text-blue-700',    light: 'bg-blue-50 border-blue-200',       bar: 'bg-blue-500',    badge: 'bg-blue-100 text-blue-800'    },
  learning: { label: '学習・スキルアップ', icon: '📚', text: 'text-purple-700',  light: 'bg-purple-50 border-purple-200',   bar: 'bg-purple-500',  badge: 'bg-purple-100 text-purple-800'},
  finance:  { label: '財務・資産形成',     icon: '💰', text: 'text-amber-700',   light: 'bg-amber-50 border-amber-200',     bar: 'bg-amber-500',   badge: 'bg-amber-100 text-amber-800'  },
};

const HABIT_EMOJIS = ['🎯','💪','🏃','🧘','🥗','💤','📚','✍️','🖥️','🧠','💰','📝','🤸','🎵','💊','🚴','🛁','🥤','🧹','🌿'];

const INITIAL_DATA = {
  goals: {
    health:   { title: '', description: '', deadline: '', milestones: [] },
    career:   { title: '', description: '', deadline: '', milestones: [] },
    learning: { title: '', description: '', deadline: '', milestones: [] },
    finance:  { title: '', description: '', deadline: '', milestones: [] },
  },
  habits: [],
  checkins: {},
  reviews: {},
};

// ─── Helpers ──────────────────────────────────────────────────────────────────

function getToday() {
  return new Date().toISOString().slice(0, 10);
}

function getWeekKey(dateStr) {
  const d = new Date(dateStr);
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${String(week).padStart(2, '0')}`;
}

function getDaysRemaining(deadline) {
  if (!deadline) return null;
  const diff = Math.ceil((new Date(deadline) - new Date(getToday())) / 86400000);
  return diff;
}

function getStreak(habitId, checkins) {
  let streak = 0;
  const d = new Date(getToday());
  while (true) {
    const key = d.toISOString().slice(0, 10);
    if (checkins[key]?.[habitId]) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function getMilestoneProgress(milestones) {
  if (!milestones || milestones.length === 0) return 0;
  return Math.round((milestones.filter(m => m.done).length / milestones.length) * 100);
}

// ─── Shared Components ────────────────────────────────────────────────────────

function ProgressBar({ value, barClass = 'bg-indigo-500', height = 'h-2' }) {
  return (
    <div className={`w-full bg-gray-200 rounded-full ${height}`}>
      <div
        className={`${height} rounded-full transition-all duration-500 ${barClass}`}
        style={{ width: `${Math.min(100, Math.max(0, value))}%` }}
      />
    </div>
  );
}

// ─── Dashboard Tab ────────────────────────────────────────────────────────────

function Dashboard({ goals, habits, checkins }) {
  const today = getToday();
  const todayCheckins = checkins[today] || {};
  const doneCount = habits.filter(h => todayCheckins[h.id]).length;
  const overallPct = habits.length > 0 ? Math.round((doneCount / habits.length) * 100) : 0;

  const dateLabel = new Date().toLocaleDateString('ja-JP', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'long',
  });

  const encouragement = overallPct === 100
    ? '🎉 完璧！今日の習慣を全て達成しました！'
    : overallPct >= 70
    ? '👍 順調です！もう少しで完了です'
    : overallPct >= 30
    ? '💡 引き続き頑張りましょう！'
    : '🌅 今日も一歩ずつ積み上げていきましょう';

  return (
    <div className="space-y-5 fade-in">
      {/* Hero card */}
      <div className="bg-gradient-to-br from-indigo-500 via-purple-500 to-purple-600 rounded-2xl p-6 text-white shadow-lg">
        <p className="text-indigo-200 text-sm">{dateLabel}</p>
        <h2 className="text-xl font-bold mt-0.5">今日の進捗</h2>
        <div className="mt-4 flex items-center gap-5">
          <div className="text-5xl font-extrabold">{overallPct}<span className="text-2xl font-bold text-indigo-200">%</span></div>
          <div className="flex-1">
            <div className="w-full bg-indigo-300/40 rounded-full h-3">
              <div
                className="h-3 rounded-full bg-white transition-all duration-700"
                style={{ width: `${overallPct}%` }}
              />
            </div>
            <p className="text-indigo-200 text-xs mt-1.5">{doneCount} / {habits.length} 習慣完了</p>
          </div>
        </div>
        <p className="text-sm text-indigo-100 mt-3">{encouragement}</p>
      </div>

      {/* Category cards */}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        {Object.entries(CATEGORIES).map(([key, cat]) => {
          const goal = goals[key];
          const catHabits = habits.filter(h => h.category === key);
          const catDone = catHabits.filter(h => todayCheckins[h.id]).length;
          const habitPct = catHabits.length > 0 ? Math.round((catDone / catHabits.length) * 100) : null;
          const milestonePct = getMilestoneProgress(goal.milestones);
          const daysLeft = getDaysRemaining(goal.deadline);

          return (
            <div key={key} className="bg-white rounded-xl border p-4 space-y-3">
              <div className="flex items-start justify-between">
                <div className="flex items-center gap-2">
                  <span className="text-xl">{cat.icon}</span>
                  <span className={`text-sm font-semibold ${cat.text}`}>{cat.label}</span>
                </div>
                {daysLeft !== null && (
                  <span className={`text-xs px-2 py-0.5 rounded-full ${daysLeft < 30 ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-500'}`}>
                    残{daysLeft}日
                  </span>
                )}
              </div>

              {goal.title
                ? <p className="text-sm font-medium text-gray-800 leading-snug">{goal.title}</p>
                : <p className="text-xs text-gray-400 italic">目標を設定してください</p>
              }

              {goal.milestones?.length > 0 && (
                <div className="space-y-1">
                  <div className="flex justify-between text-xs text-gray-400">
                    <span>マイルストーン</span>
                    <span>{goal.milestones.filter(m => m.done).length}/{goal.milestones.length}</span>
                  </div>
                  <ProgressBar value={milestonePct} barClass={cat.bar} />
                </div>
              )}

              {habitPct !== null && (
                <div className="space-y-1">
                  <div className="flex justify-between text-xs text-gray-400">
                    <span>今日の習慣</span>
                    <span>{catDone}/{catHabits.length}</span>
                  </div>
                  <ProgressBar value={habitPct} barClass={cat.bar} />
                </div>
              )}

              {catHabits.length === 0 && goal.milestones?.length === 0 && (
                <p className="text-xs text-gray-300">習慣・マイルストーン未設定</p>
              )}
            </div>
          );
        })}
      </div>

      {/* Today's quick habits */}
      {habits.length > 0 && (
        <div className="bg-white rounded-xl border p-4">
          <h3 className="font-semibold text-gray-800 text-sm mb-3">今日の習慣一覧</h3>
          <div className="divide-y">
            {habits.map(h => {
              const cat = CATEGORIES[h.category];
              const done = !!todayCheckins[h.id];
              return (
                <div key={h.id} className="flex items-center gap-3 py-2">
                  <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs ${done ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-300'}`}>
                    {done ? '✓' : '○'}
                  </span>
                  <span className="text-base">{h.emoji}</span>
                  <span className={`text-xs px-1.5 py-0.5 rounded-full ${cat?.badge}`}>{cat?.label}</span>
                  <span className={`flex-1 text-sm ${done ? 'line-through text-gray-400' : 'text-gray-700'}`}>{h.name}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Goals Tab ────────────────────────────────────────────────────────────────

function GoalEditor({ catKey, goal, onUpdate }) {
  const cat = CATEGORIES[catKey];
  const [newMilestone, setNewMilestone] = useState('');
  const progress = getMilestoneProgress(goal.milestones);
  const daysLeft = getDaysRemaining(goal.deadline);

  const addMilestone = () => {
    const text = newMilestone.trim();
    if (!text) return;
    onUpdate(catKey, {
      ...goal,
      milestones: [...(goal.milestones || []), { id: Date.now().toString(), text, done: false }],
    });
    setNewMilestone('');
  };

  const toggleMilestone = (id) => {
    onUpdate(catKey, {
      ...goal,
      milestones: goal.milestones.map(m => m.id === id ? { ...m, done: !m.done } : m),
    });
  };

  const removeMilestone = (id) => {
    onUpdate(catKey, {
      ...goal,
      milestones: goal.milestones.filter(m => m.id !== id),
    });
  };

  return (
    <div className={`bg-white rounded-xl border-2 ${cat.light} p-5 space-y-4`}>
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <span className="text-2xl">{cat.icon}</span>
          <h3 className={`font-bold ${cat.text}`}>{cat.label}</h3>
        </div>
        {daysLeft !== null && (
          <span className={`text-xs px-2 py-1 rounded-full font-medium ${daysLeft < 0 ? 'bg-red-100 text-red-700' : daysLeft < 30 ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-500'}`}>
            {daysLeft < 0 ? `${-daysLeft}日超過` : `残${daysLeft}日`}
          </span>
        )}
      </div>

      <div className="space-y-3">
        <div>
          <label className="text-xs text-gray-500 block mb-1">長期目標</label>
          <input
            type="text"
            placeholder="例: 体重を5kg減らす / TOEIC 900点取得"
            className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
            value={goal.title || ''}
            onChange={e => onUpdate(catKey, { ...goal, title: e.target.value })}
          />
        </div>
        <div>
          <label className="text-xs text-gray-500 block mb-1">詳細・動機（なぜ達成したいか）</label>
          <textarea
            rows={2}
            placeholder="この目標を達成することで何が変わるか、なぜ重要か..."
            className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"
            value={goal.description || ''}
            onChange={e => onUpdate(catKey, { ...goal, description: e.target.value })}
          />
        </div>
        <div>
          <label className="text-xs text-gray-500 block mb-1">達成期限</label>
          <input
            type="date"
            className="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
            value={goal.deadline || ''}
            onChange={e => onUpdate(catKey, { ...goal, deadline: e.target.value })}
          />
        </div>
      </div>

      {/* Milestones */}
      <div>
        <div className="flex items-center justify-between mb-2">
          <label className="text-xs text-gray-500 font-medium">マイルストーン（中間目標）</label>
          {goal.milestones?.length > 0 && (
            <span className="text-xs text-gray-400">{progress}% 達成</span>
          )}
        </div>

        {goal.milestones?.length > 0 && (
          <>
            <ProgressBar value={progress} barClass={cat.bar} />
            <div className="mt-3 space-y-2">
              {goal.milestones.map(m => (
                <div key={m.id} className="flex items-center gap-2 group">
                  <input
                    type="checkbox"
                    checked={m.done}
                    onChange={() => toggleMilestone(m.id)}
                    className="w-4 h-4 rounded accent-indigo-500 cursor-pointer"
                  />
                  <span className={`flex-1 text-sm ${m.done ? 'line-through text-gray-400' : 'text-gray-700'}`}>
                    {m.text}
                  </span>
                  <button
                    onClick={() => removeMilestone(m.id)}
                    className="text-gray-300 hover:text-red-400 text-xs transition-colors opacity-0 group-hover:opacity-100"
                  >✕</button>
                </div>
              ))}
            </div>
          </>
        )}

        <div className="flex gap-2 mt-3">
          <input
            type="text"
            placeholder="マイルストーンを追加（Enterで確定）"
            className="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
            value={newMilestone}
            onChange={e => setNewMilestone(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && addMilestone()}
          />
          <button
            onClick={addMilestone}
            className="px-4 py-2 bg-indigo-500 text-white rounded-lg text-sm hover:bg-indigo-600 transition-colors"
          >追加</button>
        </div>
      </div>
    </div>
  );
}

function Goals({ goals, onUpdate }) {
  return (
    <div className="space-y-4 fade-in">
      <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-sm text-indigo-700">
        <p className="font-semibold mb-1">目標設定のポイント</p>
        <ul className="space-y-0.5 text-xs text-indigo-600 list-disc list-inside">
          <li>具体的・測定可能な目標を設定する（SMARTゴール）</li>
          <li>マイルストーンで大きな目標を分解する</li>
          <li>「なぜ達成したいか」を明確に書く（動機の言語化）</li>
        </ul>
      </div>
      {Object.keys(CATEGORIES).map(key => (
        <GoalEditor key={key} catKey={key} goal={goals[key]} onUpdate={onUpdate} />
      ))}
    </div>
  );
}

// ─── Habits Tab ───────────────────────────────────────────────────────────────

function HabitCalendar({ habitId, checkins }) {
  const today = new Date();
  const days = [];
  for (let i = 34; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    days.push({ key, done: !!checkins[key]?.[habitId], isToday: i === 0 });
  }
  return (
    <div className="flex flex-wrap gap-1 mt-2">
      {days.map(d => (
        <div
          key={d.key}
          title={d.key}
          className={`w-4 h-4 rounded-sm transition-colors ${
            d.done ? 'bg-indigo-500' : d.isToday ? 'bg-gray-300 ring-1 ring-indigo-400' : 'bg-gray-200'
          }`}
        />
      ))}
    </div>
  );
}

function Habits({ habits, checkins, onToggle, onAdd, onRemove }) {
  const today = getToday();
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ name: '', category: 'health', emoji: '🎯' });

  const handleAdd = () => {
    if (!form.name.trim()) return;
    onAdd({ ...form, name: form.name.trim(), id: Date.now().toString() });
    setForm({ name: '', category: 'health', emoji: '🎯' });
    setShowForm(false);
  };

  const groupedHabits = useMemo(() => {
    return Object.keys(CATEGORIES).reduce((acc, key) => {
      acc[key] = habits.filter(h => h.category === key);
      return acc;
    }, {});
  }, [habits]);

  return (
    <div className="space-y-4 fade-in">
      <div className="flex items-center justify-between">
        <p className="text-sm text-gray-500">毎日の行動を記録し、継続の力を積み上げましょう。</p>
        <button
          onClick={() => setShowForm(s => !s)}
          className="px-3 py-1.5 bg-indigo-500 text-white rounded-lg text-sm hover:bg-indigo-600 transition-colors whitespace-nowrap"
        >＋ 習慣を追加</button>
      </div>

      {/* Add habit form */}
      {showForm && (
        <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4 space-y-3 fade-in">
          <h4 className="font-semibold text-indigo-700 text-sm">新しい習慣を追加</h4>
          <div className="flex gap-2">
            <select
              value={form.emoji}
              onChange={e => setForm(f => ({ ...f, emoji: e.target.value }))}
              className="border rounded-lg px-2 py-2 text-sm bg-white"
            >
              {HABIT_EMOJIS.map(e => <option key={e} value={e}>{e}</option>)}
            </select>
            <input
              type="text"
              placeholder="習慣名（例: 30分ウォーキング）"
              className="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
              value={form.name}
              onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
              onKeyDown={e => e.key === 'Enter' && handleAdd()}
              autoFocus
            />
          </div>
          <div>
            <label className="text-xs text-gray-500 block mb-2">カテゴリ</label>
            <div className="flex flex-wrap gap-2">
              {Object.entries(CATEGORIES).map(([key, cat]) => (
                <button
                  key={key}
                  onClick={() => setForm(f => ({ ...f, category: key }))}
                  className={`px-3 py-1 rounded-full text-xs border transition-colors ${
                    form.category === key
                      ? `${cat.bar} text-white border-transparent`
                      : `bg-white ${cat.text} border-current opacity-60 hover:opacity-100`
                  }`}
                >
                  {cat.icon} {cat.label}
                </button>
              ))}
            </div>
          </div>
          <div className="flex gap-2">
            <button onClick={handleAdd} className="px-4 py-2 bg-indigo-500 text-white rounded-lg text-sm hover:bg-indigo-600">追加</button>
            <button onClick={() => setShowForm(false)} className="px-4 py-2 text-gray-500 text-sm hover:text-gray-700">キャンセル</button>
          </div>
        </div>
      )}

      {/* Habit list grouped by category */}
      {habits.length === 0 ? (
        <div className="text-center py-16 text-gray-400">
          <p className="text-5xl mb-3">🌱</p>
          <p className="font-medium">習慣がまだ登録されていません</p>
          <p className="text-sm mt-1">「習慣を追加」ボタンから始めましょう</p>
        </div>
      ) : (
        Object.entries(CATEGORIES).map(([catKey, cat]) => {
          const catHabits = groupedHabits[catKey];
          if (catHabits.length === 0) return null;
          return (
            <div key={catKey} className="bg-white rounded-xl border p-4">
              <h4 className={`font-semibold text-sm ${cat.text} mb-4 flex items-center gap-1.5`}>
                <span>{cat.icon}</span> {cat.label}
              </h4>
              <div className="space-y-5">
                {catHabits.map(h => {
                  const done = !!checkins[today]?.[h.id];
                  const streak = getStreak(h.id, checkins);
                  return (
                    <div key={h.id}>
                      <div className="flex items-center gap-3">
                        <button
                          onClick={() => onToggle(h.id)}
                          className={`w-8 h-8 rounded-full border-2 flex items-center justify-center text-sm font-bold transition-all ${
                            done
                              ? 'bg-indigo-500 border-indigo-500 text-white scale-110'
                              : 'border-gray-300 text-gray-200 hover:border-indigo-400 hover:scale-105'
                          }`}
                        >
                          {done ? '✓' : ''}
                        </button>
                        <span className="text-lg">{h.emoji}</span>
                        <span className={`flex-1 text-sm font-medium ${done ? 'line-through text-gray-400' : 'text-gray-700'}`}>
                          {h.name}
                        </span>
                        {streak > 1 && (
                          <span className="text-xs bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full font-medium">
                            🔥 {streak}日連続
                          </span>
                        )}
                        {streak === 1 && (
                          <span className="text-xs bg-yellow-100 text-yellow-600 px-2 py-0.5 rounded-full">
                            ✨ 継続中
                          </span>
                        )}
                        <button
                          onClick={() => onRemove(h.id)}
                          className="text-gray-300 hover:text-red-400 transition-colors text-xs ml-1"
                          title="削除"
                        >✕</button>
                      </div>
                      <div className="ml-11">
                        <p className="text-xs text-gray-400 mt-1 mb-1">過去35日間の記録</p>
                        <HabitCalendar habitId={h.id} checkins={checkins} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

// ─── Review Tab ───────────────────────────────────────────────────────────────

function Review({ habits, checkins, reviews, onSaveReview }) {
  const weekKey = getWeekKey(getToday());
  const savedReview = reviews[weekKey] || { wins: '', challenges: '', plan: '', mood: 2 };
  const [form, setForm] = useState(savedReview);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    setForm(reviews[weekKey] || { wins: '', challenges: '', plan: '', mood: 2 });
    setSaved(false);
  }, [weekKey]);

  // Week stats (last 7 days)
  const weekDays = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    weekDays.push(d.toISOString().slice(0, 10));
  }

  const weekStats = habits.map(h => {
    const done = weekDays.filter(d => checkins[d]?.[h.id]).length;
    return { ...h, done };
  });

  const weekTotal = weekStats.reduce((sum, h) => sum + h.done, 0);
  const weekMax = habits.length * 7;
  const weekPct = weekMax > 0 ? Math.round((weekTotal / weekMax) * 100) : 0;

  const MOODS = [
    { emoji: '😞', label: 'つらい' },
    { emoji: '😕', label: 'いまいち' },
    { emoji: '😐', label: 'ふつう' },
    { emoji: '🙂', label: 'よい' },
    { emoji: '😄', label: '最高' },
  ];

  const handleSave = () => {
    onSaveReview(weekKey, form);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div className="space-y-5 fade-in">
      {/* Week stats */}
      <div className="bg-white rounded-xl border p-5">
        <div className="flex items-center justify-between mb-1">
          <h3 className="font-semibold text-gray-800">今週の成績</h3>
          <span className="text-xs text-gray-400">{weekKey}</span>
        </div>
        <div className="flex items-center gap-4 mt-3 mb-4">
          <div className="text-4xl font-extrabold text-indigo-600">{weekPct}<span className="text-xl text-indigo-400">%</span></div>
          <div className="flex-1">
            <ProgressBar value={weekPct} />
            <p className="text-xs text-gray-400 mt-1">{weekTotal} / {weekMax} 習慣完了</p>
          </div>
        </div>

        {weekStats.length > 0 && (
          <div className="space-y-2.5 pt-2 border-t">
            {weekStats.map(h => {
              const cat = CATEGORIES[h.category];
              const pct = Math.round((h.done / 7) * 100);
              return (
                <div key={h.id} className="flex items-center gap-3">
                  <span className="text-base w-5 text-center">{h.emoji}</span>
                  <span className="flex-1 text-sm text-gray-600 truncate">{h.name}</span>
                  <span className="text-xs text-gray-400 w-8 text-right">{h.done}/7</span>
                  <div className="w-20 bg-gray-200 rounded-full h-1.5">
                    <div className={`h-1.5 rounded-full ${cat?.bar || 'bg-indigo-500'}`} style={{ width: `${pct}%` }} />
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {habits.length === 0 && (
          <p className="text-sm text-gray-400 text-center py-4">習慣タブで習慣を登録しましょう</p>
        )}
      </div>

      {/* Review form */}
      <div className="bg-white rounded-xl border p-5 space-y-4">
        <h3 className="font-semibold text-gray-800">週次振り返り</h3>

        {/* Mood */}
        <div>
          <label className="text-xs text-gray-500 block mb-2">今週の気分</label>
          <div className="flex gap-2">
            {MOODS.map((m, i) => (
              <button
                key={i}
                onClick={() => setForm(f => ({ ...f, mood: i }))}
                title={m.label}
                className={`flex flex-col items-center gap-0.5 p-1.5 rounded-lg transition-all ${
                  form.mood === i ? 'bg-indigo-50 scale-110' : 'opacity-40 hover:opacity-70'
                }`}
              >
                <span className="text-2xl">{m.emoji}</span>
                <span className="text-xs text-gray-500">{m.label}</span>
              </button>
            ))}
          </div>
        </div>

        <div>
          <label className="text-xs text-gray-500 block mb-1">今週の成果・よかったこと</label>
          <textarea
            rows={3}
            placeholder="達成したこと、気づき、嬉しかったこと..."
            className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"
            value={form.wins}
            onChange={e => setForm(f => ({ ...f, wins: e.target.value }))}
          />
        </div>

        <div>
          <label className="text-xs text-gray-500 block mb-1">課題・うまくいかなかったこと</label>
          <textarea
            rows={3}
            placeholder="障害になったこと、改善したいこと..."
            className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"
            value={form.challenges}
            onChange={e => setForm(f => ({ ...f, challenges: e.target.value }))}
          />
        </div>

        <div>
          <label className="text-xs text-gray-500 block mb-1">来週の計画・改善アクション</label>
          <textarea
            rows={3}
            placeholder="来週に集中すること、具体的な行動計画..."
            className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"
            value={form.plan}
            onChange={e => setForm(f => ({ ...f, plan: e.target.value }))}
          />
        </div>

        <button
          onClick={handleSave}
          className={`w-full py-2.5 rounded-lg text-sm font-medium transition-all ${
            saved
              ? 'bg-green-500 text-white'
              : 'bg-indigo-500 text-white hover:bg-indigo-600'
          }`}
        >
          {saved ? '✓ 保存しました！' : '振り返りを保存'}
        </button>
      </div>
    </div>
  );
}

// ─── App Root ─────────────────────────────────────────────────────────────────

const TABS = [
  { key: 'dashboard', label: 'ダッシュボード', icon: '📊' },
  { key: 'goals',     label: '目標・計画',       icon: '🎯' },
  { key: 'habits',    label: '習慣トラッカー',   icon: '✅' },
  { key: 'review',    label: '週次振り返り',     icon: '📝' },
];

function App() {
  const [tab, setTab] = useState('dashboard');
  const [data, setData] = useState(() => {
    try {
      const saved = localStorage.getItem('goal-dashboard-v1');
      if (saved) return { ...INITIAL_DATA, ...JSON.parse(saved) };
    } catch {}
    return INITIAL_DATA;
  });

  // Persist to localStorage
  useEffect(() => {
    localStorage.setItem('goal-dashboard-v1', JSON.stringify(data));
  }, [data]);

  const handleUpdateGoal = useCallback((catKey, goal) => {
    setData(d => ({ ...d, goals: { ...d.goals, [catKey]: goal } }));
  }, []);

  const handleToggleHabit = useCallback((habitId) => {
    const today = getToday();
    setData(d => ({
      ...d,
      checkins: {
        ...d.checkins,
        [today]: {
          ...(d.checkins[today] || {}),
          [habitId]: !(d.checkins[today]?.[habitId]),
        },
      },
    }));
  }, []);

  const handleAddHabit = useCallback((habit) => {
    setData(d => ({ ...d, habits: [...d.habits, habit] }));
  }, []);

  const handleRemoveHabit = useCallback((habitId) => {
    if (!confirm('この習慣を削除しますか？')) return;
    setData(d => ({ ...d, habits: d.habits.filter(h => h.id !== habitId) }));
  }, []);

  const handleSaveReview = useCallback((weekKey, review) => {
    setData(d => ({ ...d, reviews: { ...d.reviews, [weekKey]: review } }));
  }, []);

  return (
    <div className="max-w-2xl mx-auto px-4 py-6 pb-24">
      {/* Header */}
      <div className="mb-6">
        <h1 className="text-2xl font-extrabold text-gray-900">目標達成ダッシュボード</h1>
        <p className="text-sm text-gray-500 mt-0.5">長期目標に向けて、毎日を積み上げましょう</p>
      </div>

      {/* Tab bar */}
      <div className="flex border-b border-gray-200 mb-6 overflow-x-auto">
        {TABS.map(t => (
          <button
            key={t.key}
            onClick={() => setTab(t.key)}
            className={`flex items-center gap-1.5 px-3 py-2.5 text-sm font-medium border-b-2 transition-colors -mb-px whitespace-nowrap ${
              tab === t.key
                ? 'border-indigo-500 text-indigo-600'
                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
            }`}
          >
            <span>{t.icon}</span>
            <span className="hidden sm:inline">{t.label}</span>
          </button>
        ))}
      </div>

      {/* Tab content */}
      {tab === 'dashboard' && (
        <Dashboard goals={data.goals} habits={data.habits} checkins={data.checkins} />
      )}
      {tab === 'goals' && (
        <Goals goals={data.goals} onUpdate={handleUpdateGoal} />
      )}
      {tab === 'habits' && (
        <Habits
          habits={data.habits}
          checkins={data.checkins}
          onToggle={handleToggleHabit}
          onAdd={handleAddHabit}
          onRemove={handleRemoveHabit}
        />
      )}
      {tab === 'review' && (
        <Review
          habits={data.habits}
          checkins={data.checkins}
          reviews={data.reviews}
          onSaveReview={handleSaveReview}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
